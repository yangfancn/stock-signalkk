name: 沪深300买入信号自动推送

# 触发条件：
#   1. 定时触发：每周一、三、五 北京时间14:30（UTC时间06:30）
#   2. 手动触发：在GitHub页面点"Run workflow"
on:
  schedule:
    - cron: '30 6 * * 1,2,3,4,5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # 第1步：拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 第2步：设置Python环境
      - name: 设置Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第3步：安装依赖
      - name: 安装依赖库
        run: |
          pip install --upgrade pip
          pip install pandas requests akshare

      # 第4步：运行选股脚本
      - name: 扫描沪深300买入信号并推送微信
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python stock_buy_signal.py
